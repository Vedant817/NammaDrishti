services:
  nammadrishti:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_FIREBASE_PROJECT_ID: ${REACT_APP_FIREBASE_PROJECT_ID:?Configure Firebase web settings}
        REACT_APP_FIREBASE_API_KEY: ${REACT_APP_FIREBASE_API_KEY:?Configure Firebase web settings}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${REACT_APP_FIREBASE_AUTH_DOMAIN:?Configure Firebase web settings}
        REACT_APP_FIREBASE_APP_ID: ${REACT_APP_FIREBASE_APP_ID:?Configure Firebase web settings}
    container_name: nammadrishti-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:?Configure Firebase backend}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-admin.json
      - AUTHORITY_TOKEN=${AUTHORITY_TOKEN:-}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:?Set an external credential path}:/run/secrets/firebase-admin.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
